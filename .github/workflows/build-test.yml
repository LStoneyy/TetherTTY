name: Build & Test

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Select an available iPhone simulator
        id: sim
        run: |
          # Pick an available iPhone simulator the runner actually has and
          # target it by UDID. Selecting by name is fragile because device
          # names legitimately contain parentheses (e.g. "iPhone SE (3rd
          # generation)") that are easy to truncate; a UDID is unambiguous and
          # matches whatever runtime the runner image ships.
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ids=[x['udid'] for r in d for x in d[r] if x.get('isAvailable') and x['name'].startswith('iPhone')]; print(ids[-1] if ids else '')")
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project TetherTTY.xcodeproj \
            -scheme TetherTTY \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
