<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-label="TetherTTY">
  <title>TetherTTY</title>
  <defs>
    <radialGradient id="tt-bg" cx="26%" cy="34%" r="90%">
      <stop offset="0%" stop-color="#0E2A33"/>
      <stop offset="55%" stop-color="#0A1E26"/>
      <stop offset="100%" stop-color="#051214"/>
    </radialGradient>
    <linearGradient id="tt-mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ABD8A"/>
      <stop offset="100%" stop-color="#46DEDE"/>
    </linearGradient>
    <radialGradient id="tt-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E3A3E"/>
      <stop offset="100%" stop-color="#06181B"/>
    </radialGradient>
    <filter id="tt-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Panel -->
  <rect x="0" y="0" width="720" height="220" rx="30" fill="url(#tt-bg)"/>
  <rect x="1" y="1" width="718" height="218" rx="29" fill="none" stroke="#75DEDE" stroke-opacity="0.10" stroke-width="1"/>

  <!-- Sigil mark: concentric rings + terminal prompt -->
  <g transform="translate(118 110)">
    <circle r="70" fill="#75DEDE" fill-opacity="0.05"/>
    <circle r="72" fill="none" stroke="#75DEDE" stroke-opacity="0.42" stroke-width="2.5"/>
    <circle r="52" fill="url(#tt-core)" stroke="url(#tt-mint)" stroke-opacity="0.78" stroke-width="4"/>
    <!-- prompt glyph: chevron + cursor -->
    <g filter="url(#tt-glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="-22,-20 2,0 -22,20" stroke="#9CEBEB" stroke-width="8"/>
      <line x1="8" y1="22" x2="30" y2="22" stroke="#0ABD8A" stroke-width="8"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="ui-rounded, 'SF Pro Rounded', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Avenir, 'Helvetica Neue', sans-serif">
    <text x="228" y="118" font-size="62" font-weight="700" letter-spacing="-0.5">
      <tspan fill="#D6E8DE">Tether</tspan><tspan fill="#46DEDE">TTY</tspan>
    </text>
    <text x="231" y="152" font-size="19" font-weight="600" letter-spacing="3" fill="#4F8A91" textLength="316" lengthAdjust="spacingAndGlyphs">SSH · TMUX · HERDR SESSIONS</text>
  </g>
</svg>
