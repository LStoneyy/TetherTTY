# Minimal tmux config for the TetherTTY App Review demo account.

set -g status on
set -g status-interval 5
set -g status-style bg=colour235,fg=colour250
set -g status-left '#[bold] TetherTTY demo: #S '
set -g status-left-length 24
set -g status-right '#[fg=colour250]%Y-%m-%d %H:%M '
# Hide the window list ("0:bash*"); the demo has one window per session.
set -g window-status-format ''
set -g window-status-current-format ''

# Size each window to the most recently active client, so a second attached
# client (e.g. phone + tablet) doesn't shrink the reviewer's view.
set -g window-size latest
setw -g aggressive-resize on

set -g mouse on
set -g history-limit 2000
