# Minimal tmux config for the TetherTTY App Review demo account.

set -g status on
set -g status-interval 5
set -g status-style bg=colour235,fg=colour250
set -g status-left '#[bold] TetherTTY demo '
set -g status-left-length 24
set -g status-right '#[fg=colour250]%Y-%m-%d %H:%M '
set -g window-status-current-style bg=colour33,fg=colour0,bold

set -g mouse on
set -g history-limit 2000
